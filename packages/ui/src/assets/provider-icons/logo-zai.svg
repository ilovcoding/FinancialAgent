<svg width="18" height="18" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 应用 logo：深蓝底 + 六边形框架 + 三根 K 线蜡烛（与桌面应用图标同源，随主题固定深色底） -->
  <defs>
    <linearGradient id="finHex" x1="8" y1="6" x2="40" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2FD9F5"/>
      <stop offset="1" stop-color="#7C5CFC"/>
    </linearGradient>
    <linearGradient id="finCandle" x1="18" y1="14" x2="30" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9BEAFF"/>
      <stop offset="1" stop-color="#2FD9F5"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="46" height="46" rx="10" fill="#0D1526"/>
  <path d="M17 8.5 H31 L39 15 V25" stroke="url(#finHex)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <path d="M31 39.5 H17 L9 33 V23" stroke="url(#finHex)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <circle cx="39" cy="28" r="2.6" fill="url(#finHex)"/>
  <circle cx="9" cy="20" r="2.6" fill="url(#finHex)"/>
  <g stroke="url(#finCandle)" stroke-width="2">
    <line x1="16" y1="20" x2="16" y2="30"/>
    <line x1="24" y1="13" x2="24" y2="35"/>
    <line x1="32" y1="22" x2="32" y2="29"/>
  </g>
  <g fill="url(#finCandle)">
    <rect x="14" y="22.5" width="4" height="4.5" rx="1"/>
    <rect x="22" y="16.5" width="4" height="13" rx="1"/>
    <rect x="30" y="24" width="4" height="4" rx="1"/>
  </g>
</svg>
